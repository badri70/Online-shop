name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 🏗 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t web:latest .

      - name: Save Docker image as artifact
        run: docker save web:latest | gzip > web.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: web.tar.gz


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: web-image

      - name: Load Docker image
        run: gunzip -c web.tar.gz | docker load

      - name: Give permission to wait_for_db.sh
        run: chmod +x ./wait_for_db.sh

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "POSTGRES_PORT=5432" >> .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for database
        run: docker compose exec -T django ./wait_for_db.sh db 5432

      - name: Run tests
        run: docker compose exec -T django pytest -v

      - name: Stop services
        if: always()
        run: docker compose down -v
