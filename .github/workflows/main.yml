name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: 🏗 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t web:latest .

      - name: Save Docker image as artifact
        run: docker save web:latest | gzip > web.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: web.tar.gz

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: web-image

      - name: Load Docker image
        run: gunzip -c web.tar.gz | docker load

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "STRIPE_SECRET_KEY=fake_stripe_key_for_tests" >> .env
          echo "STRIPE_WEBHOOK_SECRET=fake_webhook_secret" >> .env
          echo "BACKEND_DOMAIN=http://localhost" >> .env
          echo "PAYMENT_SUCCESS_URL=http://localhost/success" >> .env
          echo "PAYMENT_CANCEL_URL=http://localhost/cancel" >> .env

      - name: Give permission to wait_for_db.sh
        run: chmod +x ./wait_for_db.sh

      - name: Ensure clean environment
        run: docker compose down -v || true

      - name: Start services
        run: docker compose -f docker-compose.yaml -f docker-compose.override.ci.yaml up -d --build --renew-anon-volumes

      - name: Wait for database
        run: docker compose exec -T django ./wait_for_db.sh

      - name: Run migrations
        run: docker compose exec -T django python manage.py migrate

      - name: Run tests
        run: docker compose exec -T django python manage.py test

      - name: Stop services
        if: always()
        run: docker compose down -v
